name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK components
        run: |
          SDKMANAGER=$(ls -d $ANDROID_SDK_ROOT/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          "$SDKMANAGER" --list_installed | head -20

      - name: Gradle
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Signing key
        run: |
          keytool -genkeypair -keystore "$GITHUB_WORKSPACE/probe.jks" -alias probe \
            -storepass probe123 -keypass probe123 -keyalg RSA -keysize 2048 \
            -validity 3650 -dname "CN=JevProbe"

      - name: Build
        run: |
          gradle --no-daemon assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/probe.jks" \
            -Pandroid.injected.signing.store.password=probe123 \
            -Pandroid.injected.signing.key.alias=probe \
            -Pandroid.injected.signing.key.password=probe123
          ls -l build/outputs/apk/release/ || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jev-probe-apk
          path: build/outputs/apk/release/*.apk

      - name: Publish release asset
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-${{ github.run_number }}
          name: CI build ${{ github.run_number }}
          files: build/outputs/apk/release/*.apk
